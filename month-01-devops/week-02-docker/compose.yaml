services:
  node-app:
    build: .
    ports:
      - "5000:3000"
    environment:
      APP_PORT: "3000"
      MONGO_URL: "mongodb://mongodb:27017/myapp"
    depends_on:
      mongodb:
        condition: service_healthy

  mongodb:
    image: mongo:8
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

volumes:
  mongo-data:
